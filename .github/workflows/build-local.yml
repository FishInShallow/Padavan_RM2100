name: Build Padavan Local

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/MeIsReallyBa/padavan-4.4
  REPO_BRANCH: main
  UPLOAD_RELEASE: true
  TNAME: RM2100
  CONFIG_FILE: RM2100.config
  XRAYCONFIG_FILE: genxrayconfig.lua
  SHADOWSOCKSFILE: Shadowsocks.asp
  XRAY_FILE: xray

jobs:
  build-local:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: UpdatePackages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libtool-bin libltdl-dev gperf python3-docutils autopoint gettext zip bc bison flex kmod
          version: 1.0

      - name: Prepare environment
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Clone source
        if: (!cancelled())
        run: |
          df -hT $PWD
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH /opt/rt-n56u

      - name: Fix GCC signal handler error
        if: (!cancelled())
        run: |
          sed -i 's/void sighandler()/void sighandler(int sig)/g' /opt/rt-n56u/trunk/tools/mksquashfs_xz/squashfs-4.3/mksquashfs.c
          sed -i 's/void sigwinch_handler()/void sigwinch_handler(int sig)/g' /opt/rt-n56u/trunk/tools/mksquashfs_xz/squashfs-4.3/progressbar.c
          sed -i 's/void sigalrm_handler()/void sigalrm_handler(int sig)/g' /opt/rt-n56u/trunk/tools/mksquashfs_xz/squashfs-4.3/progressbar.c
          sed -i 's/void sigwinch_handler()/void sigwinch_handler(int sig)/g' /opt/rt-n56u/trunk/tools/mksquashfs_xz/squashfs-4.3/unsquashfs.c
          sed -i 's/void sigalrm_handler()/void sigalrm_handler(int sig)/g' /opt/rt-n56u/trunk/tools/mksquashfs_xz/squashfs-4.3/unsquashfs.c

      - name: Install CMake 3.28.3 (override 4.x)
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz
          tar -xzf cmake-3.28.3-linux-x86_64.tar.gz
          sudo mv cmake-3.28.3-linux-x86_64 /opt/cmake-3.28.3
          sudo ln -sf /opt/cmake-3.28.3/bin/cmake /usr/local/bin/cmake
          hash -r
          cmake --version

      - name: Load custom configuration
        if: (!cancelled())
        run: |
          mv -f $CONFIG_FILE /opt/rt-n56u/trunk/configs/templates/$TNAME.config
          mv -f $XRAYCONFIG_FILE /opt/rt-n56u/trunk/user/shadowsocks/ss/genxrayconfig.lua
          mv -f $SHADOWSOCKSFILE /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/Shadowsocks.asp
          mv -f $XRAY_FILE /opt/rt-n56u/trunk/user/xray/xray

      - name: Download toolchain
        if: (!cancelled())
        run: |
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh

      - name: Compile the firmware
        if: (!cancelled())
        id: compile
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cd /opt/rt-n56u/trunk
          cp -f configs/templates/$TNAME.config .config
          sudo ./build_firmware_modify $TNAME 0 
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && !cancelled()
        with:
          name: Padavan_firmware_${{ env.TNAME }}_${{ env.FILE_DATE }}
          path: /opt/rt-n56u/trunk/images/*.trx
