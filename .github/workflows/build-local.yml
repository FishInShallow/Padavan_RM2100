name: Build Padavan Local

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/MeIsReallyBa/padavan-4.4
  REPO_BRANCH: main
  UPLOAD_RELEASE: true
  TNAME: RM2100
  CONFIG_FILE: RM2100.config
  XRAYCONFIG_FILE: genxrayconfig.lua
  SHADOWSOCKSFILE: Shadowsocks.asp
  XRAY_FILE: xray
  WEBEX_FILE: web_ex.c

jobs:
  build-local:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: UpdatePackages
        env:
          DEBIAN_FRONTEND: noninteractives
        run: |
          sudo apt-get update
          sudo apt-get -y install unzip bc libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext kmod automake autopoint texinfo build-essential help2man \
            pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin

      - name: Prepare environment
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Clone source
        if: (!cancelled())
        run: |
          df -hT $PWD
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH /opt/rt-n56u

      - name: Load custom configuration
        if: (!cancelled())
        run: |
          mv -f $CONFIG_FILE /opt/rt-n56u/trunk/configs/templates/$TNAME.config
          mv -f $XRAYCONFIG_FILE /opt/rt-n56u/trunk/user/shadowsocks/ss/genxrayconfig.lua
          mv -f $SHADOWSOCKSFILE /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/Shadowsocks.asp
          mv -f $XRAY_FILE /opt/rt-n56u/trunk/user/xray/xray
          mv -f $WEBEX_FILE /opt/rt-n56u/trunk/user/httpd/web_ex.c

      - name: Download toolchain
        if: (!cancelled())
        run: |
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh

      - name: Compile the firmware
        if: (!cancelled())
        id: compile
        run: |
          cd /opt/rt-n56u/trunk
          cp -f configs/templates/$TNAME.config .config
          sudo ./build_firmware_modify $TNAME 0 
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && !cancelled()
        with:
          name: Padavan_firmware_${{ env.TNAME }}_${{ env.FILE_DATE }}
          path: /opt/rt-n56u/trunk/images/*.trx
